name: Build and deploy

# Runs whenever anything is pushed to main, including a new copy of the
# spreadsheet uploaded through the GitHub website. It rebuilds the game data
# from data/*.xlsx, saves the puzzle schedule, and publishes site/ to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"   # monthly top-up of the schedule, in case the sheet isn't touched for a year

permissions:
  contents: write   # to save data/schedule.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Test the data pipeline
        run: python -m unittest discover -s tests

      - name: Build game data from the spreadsheet
        run: |
          set -o pipefail
          python scripts/build_data.py | tee build.log
          {
            echo "### Spreadsheet build"
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the puzzle schedule
        run: |
          if git diff --quiet -- data/schedule.json && git ls-files --error-unmatch data/schedule.json >/dev/null 2>&1; then
            echo "Schedule unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "Update puzzle schedule [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
